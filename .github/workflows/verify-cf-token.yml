name: Verify Cloudflare token

on:
  pull_request:
    paths: ['.github/workflows/verify-cf-token.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe token permissions without changing anything
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          test -n "$CF_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is empty'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'CLOUDFLARE_ACCOUNT_ID is empty'; exit 1; }
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "$@"; }
          summary() { jq -c '{success, errors: [.errors[]? | {code, message}], count: (.result | if type == "array" then length else null end)}'; }
          echo "user token verify: $(api https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.code]}')"
          echo "account token verify: $(api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify" | jq -c '{success, status: .result.status, errors: [.errors[]?.code]}')"
          echo "workers scripts list: $(api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" | summary)"
          echo "pages projects list: $(api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | summary)"
          echo "workers subdomain: $(api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -c '{success, errors: [.errors[]?.code]}')"
          # An empty upload is rejected by validation when the token may edit scripts, and by authentication when it may not.
          echo "workers script edit probe: $(api -X PUT -F 'metadata={}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/package-broker-site-token-probe" | summary)"
          echo "probe script absent afterwards: $(api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/package-broker-site-token-probe/settings" | jq -c '{success, errors: [.errors[]?.code]}')"
