name: Check security metadata

on:
  pull_request:
  push:
    branches: [main, next-main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  security-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check security.txt expiry and policy
        run: |
          node --test scripts/security-metadata.test.cjs
          node plugins/security-metadata.cjs
      - name: Build and test site
        env:
          NO_UPDATE_NOTIFIER: '1'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test
