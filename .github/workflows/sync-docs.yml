name: Sync broker docs

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: Broker commit SHA (empty uses main)
        required: false
        type: string
  repository_dispatch:
    types: [broker-docs-changed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-broker-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Check out broker history
        uses: actions/checkout@v4
        with:
          repository: package-broker/broker
          ref: main
          path: .broker-docs-source
          fetch-depth: 0
          token: ${{ secrets.BROKER_DOCS_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Select commit
        id: broker
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.event.client_payload.sha }}
          BROKER_DIR: .broker-docs-source
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          const sha = (process.env.REQUESTED_SHA || execFileSync('git', ['-C', process.env.BROKER_DIR, 'rev-parse', 'HEAD'], {encoding: 'utf8'}).trim()).toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Expected a full broker commit SHA.');
          execFileSync('git', ['-C', process.env.BROKER_DIR, 'merge-base', '--is-ancestor', sha, 'origin/main']);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\nshort=${sha.slice(0, 12)}\n`);
          JS

      - name: Test and sync docs
        env:
          BROKER_DIR: .broker-docs-source
          BROKER_SHA: ${{ steps.broker.outputs.sha }}
        run: |
          node --test scripts/
          node scripts/sync-docs --ref "$BROKER_SHA"

      - name: Open sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BROKER_SHA: ${{ steps.broker.outputs.sha }}
          BROKER_SHORT: ${{ steps.broker.outputs.short }}
        run: |
          if git diff --quiet -- docs-content && test -z "$(git ls-files --others --exclude-standard docs-content)"; then
            exit 0
          fi
          branch="sync-docs"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs-content
          git commit -m "Sync broker docs $BROKER_SHORT"
          git_with_token() {
            git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' "$@"
          }
          previous=$(git_with_token ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          git_with_token push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/sync-docs-pr.md" <<BODY
          Sync docs from [broker commit $BROKER_SHORT](https://github.com/package-broker/broker/commit/$BROKER_SHA).

          Generated by scripts/sync-docs.mjs. Edit documentation in package-broker/broker/docs.
          BODY
          number=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          if test -n "$number"; then
            gh pr edit "$number" --title "Sync broker docs $BROKER_SHORT" --body-file "$RUNNER_TEMP/sync-docs-pr.md"
          else
            gh pr create --base main --head "$branch" --title "Sync broker docs $BROKER_SHORT" --body-file "$RUNNER_TEMP/sync-docs-pr.md"
          fi
